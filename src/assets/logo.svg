  <g transform="translate(132 339) scale(13.33)" fill="#FF8A3D">
    <!-- Jambage droit -->
    <path d="M42 0H57L42 26H27Z"/>
    <!-- Barre : pointe effilée vers la gauche, fondue dans le jambage droit -->
    <path d="M0 11.5L44 9.4L40 16.5Z"/>
    <!-- Jambage gauche, coupé par la barre -->
    <path d="M23 0H37.5L32.39 8.855L17.48 9.566Z"/>
    <path d="M14.673 14.434L28.198 16.125L22.5 26H8Z"/>
