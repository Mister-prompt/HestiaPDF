<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Hestia : le « H » en italique traversé d'une ligne de vitesse.
       Palette : orange #FF8A3D sur charbon #1F1B18. -->
