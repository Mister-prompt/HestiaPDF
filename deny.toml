# Politique des dépendances Rust (https://github.com/EmbarkStudios/cargo-deny)
#   cargo install cargo-deny   puis   cargo deny check
#
# Objectif : rester publiable sous n'importe quel modèle (open source ou
# payant). On n'accepte donc que des licences permissives : pas de GPL/AGPL.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Failles connues (base RustSec) : tout avertissement doit être examiné.
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Nos propres crates (publish = false) : licence à décider plus tard.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
