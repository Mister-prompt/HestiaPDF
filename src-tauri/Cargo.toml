[package]
name = "hestia-pdf"
description = "Hestia PDF : vos outils PDF, 100 % en local."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la lib et le binaire sous Windows.
name = "hestia_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
hestia-core.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
