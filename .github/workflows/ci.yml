name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances npm (versions figées)
        run: npm ci

      - name: Audit npm
        run: npm audit --audit-level=high

      - name: PDFium (empreinte SHA-256 vérifiée)
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: Format Rust
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (moteur PDF avec PDFium réel, sécurité)
        run: cargo test --workspace

      - name: TypeScript
        run: npm run check

      - name: Licences et failles connues des dépendances Rust
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans
